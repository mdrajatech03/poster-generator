<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festive & Special Day Poster Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-3xl font-bold text-center text-amber-400 mb-2">Festive Poster Generator</h1>
    <p class="text-center text-slate-400 mb-6">Apna naam, photo aur occasion daal kar custom AI poster banayein</p>

    <form id="posterForm" class="space-y-4">
      <div>
        <label class="block text-sm mb-1 text-slate-300">Aapka Naam</label>
        <input type="text" id="username" placeholder="Jaise: Rahul Kumar" required class="w-full p-3 rounded-lg bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-sm mb-1 text-slate-300">Occasion / Tyohar Ka Naam</label>
        <input type="text" id="occasion" placeholder="Jaise: Independence Day, Diwali, Birthday, Gandhi Jayanti" required class="w-full p-3 rounded-lg bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-sm mb-1 text-slate-300">Apni Photo Upload Karein</label>
        <input type="file" id="userPhoto" accept="image/*" required class="w-full p-2 rounded-lg bg-slate-700 text-slate-300 border border-slate-600">
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 font-semibold rounded-lg text-slate-900 transition">
        Generate Poster
      </button>
    </form>

    <div id="loading" class="hidden text-center my-6">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-amber-400 mb-2"></div>
      <p class="text-amber-400 text-sm">AI Poster Design ho raha hai... Kripya 10-15 seconds wait karein.</p>
    </div>

    <div id="resultContainer" class="mt-8 hidden text-center">
      <h2 class="text-xl font-bold text-amber-400 mb-4">Aapka Poster Ready Hai!</h2>
      <img id="generatedImage" class="mx-auto rounded-lg max-w-full shadow-lg border border-slate-600" src="" alt="Generated Poster">
      <a id="downloadBtn" download="poster.png" class="inline-block mt-4 px-6 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-white font-medium transition">
        Download Poster
      </a>
    </div>
  </div>

  <script>
    document.getElementById('posterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const resultContainer = document.getElementById('resultContainer');

      const username = document.getElementById('username').value;
      const occasion = document.getElementById('occasion').value;
      const photoFile = document.getElementById('userPhoto').files[0];

      const formData = new FormData();
      formData.append('username', username);
      formData.append('occasion', occasion);
      formData.append('photo', photoFile);

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');

      try {
        const response = await fetch('/generate-poster', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success && data.imageUrl) {
          document.getElementById('generatedImage').src = data.imageUrl;
          document.getElementById('downloadBtn').href = data.imageUrl;
          resultContainer.classList.remove('hidden');
        } else {
          alert('Failed to generate poster: ' + (data.message || 'Something went wrong.'));
        }
      } catch (err) {
        console.error(err);
        alert('Server connection error.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
